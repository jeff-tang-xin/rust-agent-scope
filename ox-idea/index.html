<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OXidea</title>
    <script src="/boot.js"></script>
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" class="splash" data-tauri-drag-region>
      <svg class="splash-logo" viewBox="22 24 56 56" aria-hidden="true">
        <defs>
          <linearGradient id="splash-oxg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366F1" />
            <stop offset="1" stop-color="#8B5CF6" />
          </linearGradient>
        </defs>
        <rect x="22" y="26" width="56" height="52" rx="12" fill="url(#splash-oxg)" />
        <rect x="27" y="26" width="46" height="42" rx="9" fill="#17171F" />
        <circle cx="41.4" cy="47.5" r="7" fill="none" stroke="#EAE7E0" stroke-width="4.2" />
        <g stroke="#EAE7E0" stroke-width="4.2" stroke-linecap="round">
          <line x1="54" y1="41.7" x2="65.6" y2="53.3" />
          <line x1="65.6" y1="41.7" x2="54" y2="53.3" />
        </g>
      </svg>
      <!-- "OXidea" in the system UI font: brand wordmark; the splash is brief, so a
           system-font render is acceptable (no web-font swap flash to avoid). -->
      <svg class="splash-wordmark" viewBox="0 0 340 96" role="img" aria-label="OXidea">
        <text
          x="0"
          y="72"
          font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="80"
          font-weight="500"
          letter-spacing="-2"
          fill="currentColor"
        >
          OXidea
        </text>
      </svg>
      <div class="splash-bar" role="progressbar" aria-label="Loading"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
