// OXidea: runs a main class on its Gradle source set's runtime classpath, like IntelliJ
// IDEA's "Build and run using: Gradle" (ApplicationTaskInitScript.gradle). Parameters come
// as system properties so this file never changes: see `gradleRun.ts`.
import groovy.json.JsonSlurper

def target = System.getProperty('oxidea.run.project')
if (target != null) {
    allprojects { p ->
        // `target` is an identity path (`:lib:core` for a project of an included build).
        def id = { try { p.identityPath.toString() } catch (ignored) { p.path } }
        if (id() != target) return
        p.plugins.withId('java') {
            def json = new JsonSlurper()
            def list = { String key -> (List) json.parseText(System.getProperty(key, '[]')) }
            p.tasks.register('oxideaRun', JavaExec) { t ->
                t.description = 'Runs a main class for OXidea.'
                t.classpath = p.sourceSets.getByName(System.getProperty('oxidea.run.sourceSet', 'main')).runtimeClasspath
                t.mainClass.set(System.getProperty('oxidea.run.main'))
                t.args(list('oxidea.run.args'))
                t.jvmArgs(list('oxidea.run.jvmArgs'))
                // The IDE attaches to this JVM, not to the Gradle daemon; port 0 prints the one picked.
                if (Boolean.getBoolean('oxidea.run.debug')) {
                    t.jvmArgs('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:0')
                }
                def dir = System.getProperty('oxidea.run.workingDir')
                if (dir) t.workingDir = dir
                t.standardInput = System.in
            }
        }
    }
}
