[package]
name = "agentscope-acp"
description = "OX Hareness: the OXidea built-in coding agent (AgentScope) exposed as an ACP v1 server over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentscope-core = { path = "../../../crates/agentscope-core" }
agentscope-browser = { path = "../../../crates/agentscope-browser" }
agentscope-harness = { path = "../../../crates/agentscope-harness" }
agentscope-model-anthropic = { path = "../../../crates/agentscope-model-anthropic" }
agentscope-model-dashscope = { path = "../../../crates/agentscope-model-dashscope" }
agentscope-model-gemini = { path = "../../../crates/agentscope-model-gemini" }
agentscope-model-ollama = { path = "../../../crates/agentscope-model-ollama" }
agentscope-model-openai = { path = "../../../crates/agentscope-model-openai" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[[bin]]
name = "agentscope-acp"
path = "src/main.rs"
