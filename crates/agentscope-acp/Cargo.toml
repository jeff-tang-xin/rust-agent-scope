[package]
name = "agentscope-acp"
description = "ACP (Agent Client Protocol) server adapter: exposes agentscope agents to ACP clients such as OpenIDEA over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
agentscope-model-anthropic = { path = "../agentscope-model-anthropic" }
agentscope-model-dashscope = { path = "../agentscope-model-dashscope" }
agentscope-model-gemini = { path = "../agentscope-model-gemini" }
agentscope-model-ollama = { path = "../agentscope-model-ollama" }
agentscope-model-openai = { path = "../agentscope-model-openai" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[[bin]]
name = "agentscope-acp"
path = "src/main.rs"
