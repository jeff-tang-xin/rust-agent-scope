[package]
name = "agentscope-browser"
version = "0.1.0"
edition = "2021"
description = "Browser automation toolset for agentscope agents: a real Chromium browser (headless) driven over CDP, shared by the studio and ox-idea apps"
license = "MIT OR Apache-2.0"

[dependencies]
agentscope-core = { path = "../agentscope-core" }
async-trait = "0.1"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
