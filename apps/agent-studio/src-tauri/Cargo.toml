[package]
name = "agent-studio"
version = "0.1.0"
description = "AgentScope Studio - desktop workbench for the agentscope-rust harness"
authors = ["agentscope-rust"]
edition = "2024"

# 独立 workspace：apps/agent-studio 位于主仓库目录树内，但不应被主 Cargo workspace
# 吸收（tauri 依赖树很重，避免拖慢主 workspace 的构建）。空 [workspace] 表即断开。
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures = "0.3"
# 接口/并发测试工具（api_request）：HTTP 客户端（默认特性已够，body/text 均用原始文本）。
reqwest = "0.12"

# AgentScope Rust harness（path 依赖指向主仓库 crates；跨 workspace path 依赖合法）
agentscope-core = { path = "../../../crates/agentscope-core" }
agentscope-model-openai = { path = "../../../crates/agentscope-model-openai" }
agentscope-model-anthropic = { path = "../../../crates/agentscope-model-anthropic" }
agentscope-model-gemini = { path = "../../../crates/agentscope-model-gemini" }
agentscope-model-ollama = { path = "../../../crates/agentscope-model-ollama" }
agentscope-model-dashscope = { path = "../../../crates/agentscope-model-dashscope" }
agentscope-model-openai-official = { path = "../../../crates/agentscope-model-openai-official" }
agentscope-harness = { path = "../../../crates/agentscope-harness" }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
chromiumoxide = "0.9.1"
base64 = "0.23.1"
calamine = "0.38.0"
pdf-extract = "0.12.1"
# XMind 导入解析（.xmind = zip 包；zip/quick-xml 已在依赖树，编译增量小）
zip = "9"
quick-xml = "0.42"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
