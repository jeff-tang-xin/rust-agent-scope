[workspace]
resolver = "2"
members = [
    "crates/agentscope-core",
    "crates/agentscope-model-openai",
    "crates/agentscope-model-anthropic",
    "crates/agentscope-model-gemini",
    "crates/agentscope-model-ollama",
    "crates/agentscope-model-dashscope",
    "crates/agentscope-model-openai-official",
    "crates/agentscope-harness",
    "crates/agentscope-browser",
    "examples/quickstart",
]
# ox-idea 是独立的 Cargo workspace（OpenIDEA fork 验证目录），不纳入本 workspace。
# agentscope-acp 已移入 ox-idea/crates/（仅 IDE 使用）。
exclude = ["ox-idea"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agentscope-core = { path = "crates/agentscope-core" }
agentscope-model-openai = { path = "crates/agentscope-model-openai" }
agentscope-model-anthropic = { path = "crates/agentscope-model-anthropic" }
agentscope-model-gemini = { path = "crates/agentscope-model-gemini" }
agentscope-model-ollama = { path = "crates/agentscope-model-ollama" }
agentscope-model-dashscope = { path = "crates/agentscope-model-dashscope" }
agentscope-model-openai-official = { path = "crates/agentscope-model-openai-official" }

async-trait = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
