[workspace]
resolver = "2"
members = [
    "crates/agentscope-core",
    "crates/agentscope-model-openai",
    "crates/agentscope-harness",
    "examples/quickstart",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agentscope-core = { path = "crates/agentscope-core" }
agentscope-model-openai = { path = "crates/agentscope-model-openai" }

async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
