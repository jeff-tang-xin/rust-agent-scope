name: Release

# 推 v* tag（如 v0.1.0）自动出 Windows/macOS/Linux 三平台安装包并发布到
# GitHub Releases，同时生成 updater 清单 latest.json。应用内自动更新指向
# https://github.com/jeff-tang-xin/rust-agent-scope/releases/latest/download/latest.json
#
# 发布流程：
#   cd ox-idea && pnpm release:prepare 0.1.0   # 改 Cargo.toml/package.json/tauri.conf.json 版本
#   git commit -am "chore: v0.1.0" && git tag v0.1.0 && git push origin main --tags
#
# 必需仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           updater 签名私钥（pnpm tauri signer generate 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（生成时未设则留空）
#   GITHUB_TOKEN 由 Actions 自动提供，无需手动配。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 tag 的新推送取消还在跑的旧运行，避免旧（含 bug）运行与新运行同时
# 往同一个 Release 上传产物造成混乱。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Derives the official plugins' public key from PLUGIN_SIGNING_KEY (the seed
  # `oxidea-plugin keygen` writes) and pins it into release builds: official
  # plugin packages must carry its signature whatever the marketplace index
  # lists. Empty output when the secret is unset (development behavior).
  plugin-keys:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - id: keys
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            seed="$(printf %s "$SIGNING_KEY" | base64 -d | od -An -tx1 | tr -d ' \n')"
            key="$(printf '302e020100300506032b657004220420%s' "$seed" | xxd -r -p |
              openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64)"
            echo "keys=$key" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: plugin-keys
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # arm64 runner，构建 universal 通用包（Intel+Apple Silicon）
            target: universal-apple-darwin
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
          - platform: ubuntu-22.04        # 较旧 glibc，AppImage 兼容面广
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ox-idea/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ox-idea

      - name: Install frontend dependencies
        working-directory: ox-idea
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXIDEA_OFFICIAL_PLUGIN_KEYS: ${{ needs.plugin-keys.outputs.keys }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ox-idea
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'OXidea v__VERSION__'
          releaseBody: 'Download the installer for your platform below. In-app auto-update is built in.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  # The official plugins, signed, and the marketplace index released apps read
  # (releases/latest/download/plugins-index.json) — installed from
  # Settings › Plugins. Ported from ox-idea/.github/workflows/release.yml,
  # which GitHub never ran (Actions only reads the repo root's .github/).
  # Without the signing key (secret PLUGIN_SIGNING_KEY: the file
  # `oxidea-plugin keygen` writes) nothing is published and the release goes
  # on. The index also lists the community plugins of the registry
  # (COMMUNITY_PLUGINS_INDEX), and the release carries the oxidea-plugin tool
  # for Linux x64, which the registry's checks run.
  plugins:
    needs: publish-tauri
    name: Official plugins
    runs-on: ubuntu-22.04
    env:
      SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
      COMMUNITY_PLUGINS_INDEX: https://github.com/l0ng-ai/oxidea-plugins/releases/download/index/index.json
    steps:
      - id: key
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::PLUGIN_SIGNING_KEY is not set: the official plugins are not published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.skip != 'true'
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.skip != 'true'
        with:
          workspaces: ox-idea
          key: release-plugins
      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.skip != 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Build
        if: steps.key.outputs.skip != 'true'
        working-directory: ox-idea
        run: |
          plugins/build.sh --check
          cargo build --release --locked -p ide-host --bin oxidea-plugin
      - name: Pack, index and upload
        if: steps.key.outputs.skip != 'true'
        working-directory: ox-idea
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tool="$PWD/target/release/oxidea-plugin"
          key="$RUNNER_TEMP/oxidea.key"
          out="$RUNNER_TEMP/market"
          (umask 077 && printf '%s' "$SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          mkdir -p "$out"
          for dir in plugins/official/*/; do
            id="$(sed -n 's/^id *= *"\(.*\)".*/\1/p' "$dir/plugin.toml" | head -1)"
            version="$(sed -n 's/^version *= *"\(.*\)".*/\1/p' "$dir/plugin.toml" | head -1)"
            "$tool" pack "$dir" --key "$key" --publisher oxidea --out "$out/$id-$version.oiplugin"
          done
          # The published index's revocations, earlier keys and community plugins carry over.
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/plugins-index.json" \
            -o "$out/plugins-index.json" || rm -f "$out/plugins-index.json"
          # Downloads point at this release: older versions kept for older IDEs stay where they were published.
          "$tool" index "$out" --publisher oxidea --name OXidea --key "$key" --out "$out/plugins-index.json" \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ github.ref_name }}"
          "$tool" merge "$out/plugins-index.json" "$COMMUNITY_PLUGINS_INDEX" --keep oxidea ||
            echo "::warning::the community plugins were not refreshed"
          gzip -9 -c "$tool" > "$out/oxidea-plugin-linux-x86_64.gz"
          gh release upload "${{ github.ref_name }}" "$out"/*.oiplugin "$out/plugins-index.json" \
            "$out/oxidea-plugin-linux-x86_64.gz" --clobber
